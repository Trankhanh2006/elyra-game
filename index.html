<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELYRA - Complete Adventure Game</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1024" height="768"></canvas>
        
        <!-- Story Panel -->
        <div id="storyPanel">
            <div id="storyText"></div>
        </div>
        
        <!-- Control Panel -->
        <div id="controlPanel">
            <button id="btnSave" class="controlBtn">💾 Save</button>
            <button id="btnLoad" class="controlBtn">📂 Load</button>
            <button id="btnHelp" class="controlBtn">❓ Help</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/constants.js"></script>
    <script src="js/input.js"></script>
    <script src="js/worldBuilder.js"></script>
    <script src="js/questSystem.js"></script>
    <script src="js/sprite.js"></script>
    <script src="js/tileRenderer.js"></script>
    <script src="js/player.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/animation.js"></script>
    <script src="js/effectSystem.js"></script>
    <script src="js/bossAI.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/storyEngine.js"></script>
    <script src="js/mapSystem.js"></script>
    <script src="js/saveSystem.js"></script>
    <script src="js/render.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
